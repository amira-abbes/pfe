<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">Figure XX : Organisation des API Backend</title>
  <desc id="desc">Schema presentant l'organisation des API backend FastAPI par domaines fonctionnels et leurs interactions avec les services metier et les donnees.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 800 34px Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #475569; }
      .card { fill: #ffffff; stroke: #dbeafe; stroke-width: 2; rx: 22; filter: url(#shadow); }
      .front { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.4; rx: 24; filter: url(#shadow); }
      .api-zone { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 30; }
      .api-head { fill: #1d4ed8; rx: 24; }
      .service-zone { fill: #ecfeff; stroke: #99f6e4; stroke-width: 2; rx: 30; }
      .service-head { fill: #0f766e; rx: 24; }
      .api { fill: #ffffff; stroke: #93c5fd; stroke-width: 1.9; rx: 16; filter: url(#shadow); }
      .service { fill: #ffffff; stroke: #5eead4; stroke-width: 1.9; rx: 16; filter: url(#shadow); }
      .data { fill: #ffffff; stroke: #a78bfa; stroke-width: 2.2; rx: 22; filter: url(#shadow); }
      .external { fill: #ffffff; stroke: #fb923c; stroke-width: 2.2; rx: 22; filter: url(#shadow); }
      .label { font: 800 23px Arial, sans-serif; fill: #0f172a; }
      .head-label { font: 800 22px Arial, sans-serif; fill: #ffffff; }
      .small { font: 700 15px Arial, sans-serif; fill: #334155; }
      .tiny { font: 600 13px Arial, sans-serif; fill: #64748b; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrowBlue); }
      .flow-teal { fill: none; stroke: #0f766e; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrowTeal); }
      .flow-gray { fill: none; stroke: #64748b; stroke-width: 2.6; stroke-linecap: round; marker-end: url(#arrowGray); }
      .icon-blue { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon-teal { fill: none; stroke: #0f766e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon-purple { fill: none; stroke: #7c3aed; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon-orange { fill: none; stroke: #ea580c; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .hint { font: 800 14px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1600" height="950" class="bg"/>
  <text x="800" y="58" text-anchor="middle" class="title">Organisation des API Backend</text>
  <text x="800" y="91" text-anchor="middle" class="subtitle">API FastAPI organisees par domaines fonctionnels et reliees aux services metier</text>

  <!-- Frontend -->
  <rect x="80" y="385" width="250" height="140" class="front"/>
  <g transform="translate(116 418)">
    <rect x="0" y="12" width="62" height="44" rx="8" class="icon-blue"/>
    <path d="M13 70h36M23 56v14M39 56v14" class="icon-blue"/>
  </g>
  <text x="225" y="435" text-anchor="middle" class="label">React JS</text>
  <text x="225" y="464" text-anchor="middle" class="small">Frontend</text>
  <text x="225" y="492" text-anchor="middle" class="tiny">navigation et appels API</text>

  <!-- API zone -->
  <rect x="405" y="145" width="480" height="650" class="api-zone"/>
  <rect x="405" y="145" width="480" height="56" rx="28" class="api-head"/>
  <text x="645" y="181" text-anchor="middle" class="head-label">Couche API FastAPI</text>

  <rect x="450" y="235" width="185" height="72" class="api"/>
  <text x="542" y="264" text-anchor="middle" class="small">Authentification</text>
  <text x="542" y="288" text-anchor="middle" class="tiny">login, MFA, session</text>

  <rect x="655" y="235" width="185" height="72" class="api"/>
  <text x="747" y="264" text-anchor="middle" class="small">Administration</text>
  <text x="747" y="288" text-anchor="middle" class="tiny">utilisateurs</text>

  <rect x="450" y="332" width="185" height="72" class="api"/>
  <text x="542" y="361" text-anchor="middle" class="small">Departements</text>
  <text x="542" y="385" text-anchor="middle" class="tiny">droits, permissions</text>

  <rect x="655" y="332" width="185" height="72" class="api"/>
  <text x="747" y="361" text-anchor="middle" class="small">Securite compte</text>
  <text x="747" y="385" text-anchor="middle" class="tiny">codes, activite</text>

  <rect x="450" y="429" width="185" height="72" class="api"/>
  <text x="542" y="458" text-anchor="middle" class="small">Activation</text>
  <text x="542" y="482" text-anchor="middle" class="tiny">compte, TOTP</text>

  <rect x="655" y="429" width="185" height="72" class="api"/>
  <text x="747" y="458" text-anchor="middle" class="small">Reset password</text>
  <text x="747" y="482" text-anchor="middle" class="tiny">recuperation MFA</text>

  <rect x="450" y="526" width="185" height="72" class="api"/>
  <text x="542" y="555" text-anchor="middle" class="small">ELT</text>
  <text x="542" y="579" text-anchor="middle" class="tiny">jobs, rapports</text>

  <rect x="655" y="526" width="185" height="72" class="api"/>
  <text x="747" y="555" text-anchor="middle" class="small">Bad Debts</text>
  <text x="747" y="579" text-anchor="middle" class="tiny">clients, scoring</text>

  <rect x="552" y="623" width="185" height="72" class="api"/>
  <text x="645" y="652" text-anchor="middle" class="small">Incidents securite</text>
  <text x="645" y="676" text-anchor="middle" class="tiny">signalements</text>

  <!-- Service zone -->
  <rect x="955" y="145" width="400" height="650" class="service-zone"/>
  <rect x="955" y="145" width="400" height="56" rx="28" class="service-head"/>
  <text x="1155" y="181" text-anchor="middle" class="head-label">Services metier</text>

  <rect x="1000" y="240" width="310" height="72" class="service"/>
  <text x="1155" y="269" text-anchor="middle" class="small">Authentification &amp; sessions</text>
  <text x="1155" y="293" text-anchor="middle" class="tiny">controle identite et acces</text>

  <rect x="1000" y="342" width="310" height="72" class="service"/>
  <text x="1155" y="371" text-anchor="middle" class="small">Administration &amp; permissions</text>
  <text x="1155" y="395" text-anchor="middle" class="tiny">comptes, roles, departements</text>

  <rect x="1000" y="444" width="310" height="72" class="service"/>
  <text x="1155" y="473" text-anchor="middle" class="small">Securite &amp; notifications</text>
  <text x="1155" y="497" text-anchor="middle" class="tiny">alertes, audit, emails</text>

  <rect x="1000" y="546" width="310" height="72" class="service"/>
  <text x="1155" y="575" text-anchor="middle" class="small">Traitements ELT</text>
  <text x="1155" y="599" text-anchor="middle" class="tiny">execution et suivi</text>

  <rect x="1000" y="648" width="310" height="72" class="service"/>
  <text x="1155" y="677" text-anchor="middle" class="small">Analyse Bad Debts</text>
  <text x="1155" y="701" text-anchor="middle" class="tiny">indicateurs et resultats ML</text>

  <!-- Data/external -->
  <rect x="560" y="835" width="300" height="78" class="data"/>
  <g transform="translate(586 855)">
    <ellipse cx="25" cy="10" rx="22" ry="8" class="icon-purple"/>
    <path d="M3 10v32c0 5 10 9 22 9s22-4 22-9V10" class="icon-purple"/>
  </g>
  <text x="735" y="868" text-anchor="middle" class="small">PostgreSQL</text>
  <text x="735" y="892" text-anchor="middle" class="tiny">donnees applicatives, securite, analytique</text>

  <rect x="1030" y="835" width="270" height="78" class="external"/>
  <g transform="translate(1055 855)">
    <path d="M8 43V17l20-10 20 10v26L28 53z" class="icon-orange"/>
    <path d="M18 30h20M28 18v24" class="icon-orange"/>
  </g>
  <text x="1180" y="868" text-anchor="middle" class="small">Services analytiques</text>
  <text x="1180" y="892" text-anchor="middle" class="tiny">ELT, Power BI, Machine Learning</text>

  <!-- Flows -->
  <path d="M330 455 L397 455" class="flow"/>
  <text x="348" y="437" class="hint">requete</text>

  <path d="M885 470 L947 470" class="flow-teal"/>
  <text x="894" y="452" class="hint">regles metier</text>

  <path d="M1085 795 C1015 835 910 870 867 874" class="flow-gray"/>
  <path d="M710 795 L710 828" class="flow-gray"/>
  <path d="M1155 795 L1155 828" class="flow-gray"/>

  <!-- API to service hints -->
  <path d="M840 270 C900 270 930 275 990 276" class="flow-teal"/>
  <path d="M840 368 C900 368 930 376 990 378" class="flow-teal"/>
  <path d="M840 466 C900 466 930 478 990 480" class="flow-teal"/>
  <path d="M635 562 C785 562 880 580 990 582" class="flow-teal"/>
  <path d="M840 562 C910 610 940 682 990 684" class="flow-teal"/>

  <!-- Security note -->
  <rect x="104" y="620" width="220" height="78" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="214" y="651" text-anchor="middle" class="small">Controle transversal</text>
  <text x="214" y="676" text-anchor="middle" class="tiny">JWT, session, roles</text>
  <text x="214" y="697" text-anchor="middle" class="tiny">permissions</text>

  <path d="M324 657 C365 635 382 570 404 520" class="flow-gray"/>
</svg>
